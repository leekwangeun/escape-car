# What the story writer is told and what the checker holds every draft to.
# Loaded once at start (app/rules.py); a mistake here stops the server instead of weakening a check.

[limits]
bubble = 18
hint = 70
title = 20
intro = 180
treasure = 90

# speech is shorter for the youngest age on board
[limits.speech]
LITTLE = 110
CAPTAIN = 170
DETECTIVE = 210

# the line said the moment the answer is in
[limits.result]
LITTLE = 70
CAPTAIN = 90
DETECTIVE = 90

# Words the car never says anywhere. A match is reported as '<label>: <matched text>',
# or just the label when quote_match is false. Patterns are Python regular expressions.

# scary, hurtful or rude: the car says these to a child with nobody choosing them first
[[forbid]]
label = "무서운 말"
patterns = [
  '죽(?!순)',
  '(?<![가-힣])피(가|를|투성이)',
  '코피',
  '귀신',
  '유령',
  '괴물',
  '좀비',
  '악마',
  '저주',
  '살인',
  '총(을|으로|알|소리)',
  '칼(을|로|날)',
  '폭탄',
  '폭발',
  '불타',
  '불이\s*나',
  '화재',
  '다쳐',
  '다치',
  '상처',
  '비명',
  '무서',
  '공포',
  '무\s*시\s*무\s*시',
  '감옥',
  '납치',
  '바보',
  '멍청',
  '꺼져',
  '짜증',
  '미워',
  '혼나',
  '혼날',
]

# self-harm: never a story, whatever a wish asks
[[forbid]]
label = "자해나 자살"
patterns = [
  '자살',
  '(?<![가-힣])자\s+살(?![가-힣])',
  '자해',
  '극단\s*적\s*인?\s*선택',
  '목\s*매',
  '투신',
  '목숨을?\s*끊',
]

# would have the family do something unsafe with the car
[[forbid]]
label = "차 안전"
patterns = [
  '(?<![가-힣])차\s*문',
  '(?<![가-힣])창\s*문\s*을?\s*열',
  '밖\s*으\s*로\s*나\s*가',
  '(?<![가-힣])차\s*에\s*서\s*내',
  '(?<![가-힣])벨\s*트\s*를?\s*(풀|빼)',
  '운전(해|하|을)',
  '출발',
  '시동',
  '기어를',
  '기\s*어\s*레\s*버',
  '핸들',
  '브레이크',
  '액셀',
  '엑셀',
  '일어서',
]

# the app never asks anything about the child
[[forbid]]
label = "개인정보"
patterns = [
  '이름(을|이)\s*뭐',
  '주소',
  '전\s*화\s*번\s*호',
  '비\s*밀\s*번\s*호',
  '사진(을|찍)',
  '몇\s*살',
]

[[forbid]]
label = "영어나 주소"
quote_match = false
patterns = [
  '[A-Za-z]|https?:|www\.',
]

# No story is told the time of day, and a shelved story is played at any hour, so none of these may appear in it
# (the writer is told so; a story that has one anyway is not shelved). The season is told: the shelf keeps it with
# the story and offers it only in the same season.
[library]
never = ["아침", "저녁", "밤", "새벽", "노을"]

# The car is parked: the writer is told up front to avoid these in every line.
[prompt]
everywhere_never = ["출발", "시동", "운전해", "운전하", "운전을", "기어", "핸들", "브레이크", "차 문", "창문을 열"]
# The bubble sits next to the picture before the child has looked: it shows the trouble, never the button.
bubble_never = ["독서등", "성에", "내기", "외기", "순환", "풍향", "풍량", "온도", "에어컨", "열선", "버튼", "켜기", "끄기"]

# The belt mission's table. Every other puzzle is a quiz (keys "Q:<KIND>:<DIAL>:<VALUE>"): the question and its
# answer are checked by app/quiz.py, not by word lists.
#   situation       what the writer is told about the scene
#   must            groups of words; one word of every group must be in the speech
#   never           none of these may be in the bubble, speech or hint
#   hint_must       groups the hint must contain, so it points the same way
#   needs_guardian  the friend has the child point the found button out to the 안전 지킴이 (default true)
#   art_never       what the drawn picture of this puzzle must not show, because it would give one answer away

[scene."BELT"]
situation = "벨트 딸깍 미션: 탐험대장이 스스로 안전벨트를 딸깍 맨다. 이미 매고 있다면 버클을 손으로 짚고 \"딸깍 확인!\"이라고 말한다. 안전 지킴이는 보고 확인 버튼만 누른다. 차는 주차 중이므로 \"출발\" 대신 \"탐험 준비\"처럼 말한다."
must = [["딸깍"]]
never = ["풀어", "풀고", "풀면", "풀러"]
needs_guardian = false
